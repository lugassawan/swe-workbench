name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate JSON well-formedness
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate manifests against vendored JSON schemas
        run: |
          python3 -m pip install --require-hashes -r tests/release-requirements.lock
          python3 - <<'PY'
          import json, sys
          from jsonschema import Draft7Validator
          targets = [
              (".claude-plugin/plugin.json",      ".claude-plugin/schemas/plugin.schema.json"),
              (".claude-plugin/marketplace.json", ".claude-plugin/schemas/marketplace.schema.json"),
          ]
          failed = False
          for doc_path, schema_path in targets:
              with open(doc_path) as f: doc = json.load(f)
              with open(schema_path) as f: schema = json.load(f)
              errors = sorted(Draft7Validator(schema).iter_errors(doc), key=lambda e: list(e.absolute_path))
              if errors:
                  failed = True
                  print(f"::error file={doc_path}::{len(errors)} schema violation(s)")
                  for e in errors:
                      loc = "/".join(str(p) for p in e.absolute_path) or "<root>"
                      print(f"  {doc_path} @ {loc}: {e.message}")
          sys.exit(1 if failed else 0)
          PY

      - name: Verify tag matches manifest versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          while IFS=$'\t' read -r path field; do
            VER=$(jq -r "$field" "$path")
            if [ "$TAG" != "$VER" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (=$TAG) does not match ${path} (${field}) version ($VER)"
              exit 1
            fi
          done < <(jq -r '.files[] | [.path, .field] | @tsv' .version-bump.json)

  publish-release:
    needs: validate-schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release view exits 1 when the release doesn't exist; stderr is
          # intentionally preserved so auth/network errors remain visible.
          if gh release view "$GITHUB_REF_NAME" >/dev/null; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
