name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Keep in sync with .githooks/commit-msg
          PATTERN='^\[(feat|fix|refactor|test|ci|docs|perf|chore|polish|breaking)\]:? .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must match format: [type] Description or [type]: Description (e.g. [feat] Add new feature or [chore]: Bump dep)"
            echo ""
            echo "Allowed types: feat, fix, refactor, test, ci, docs, perf, chore, polish, breaking"
            exit 1
          fi

      - name: Validate PR description
        # Intentionally runs for dependabot[bot] too — Dependabot bodies always contain release notes.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TRIMMED=$(echo "$PR_BODY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$TRIMMED" ]; then
            echo "::error::PR description must not be empty"
            exit 1
          fi

      - name: Validate commit authorship
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BAD=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.author.email' \
            | grep -E '^(test@example\.com|t@t(\.com)?)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::PR contains commits from a placeholder test identity: $BAD"
            echo "Rewrite with: git rebase main --exec 'git commit --amend --reset-author --no-edit'"
            exit 1
          fi

      - name: Validate issue reference
        # Dependabot cannot inject closing keywords; dependency bumps have no linked issue.
        if: github.actor != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip HTML comments first so example text inside <!-- ... --> blocks
          # (e.g. "Issue: N/A" documentation in the PR template) does not
          # accidentally match the opt-out or closing-keyword patterns.
          PR_BODY_VISIBLE=$(echo "$PR_BODY" | python3 -c \
            "import re,sys; print(re.sub(r'<!--.*?(?:-->|$)','',sys.stdin.read(),flags=re.DOTALL))")

          # Allow ad-hoc PRs that explicitly opt out with "N/A" or "Issue: N/A" on its own line.
          # Accepts: "N/A", "Issue: N/A", "Issue: N/A — reason", "N/A — reason".
          if echo "$PR_BODY_VISIBLE" | grep -iqE '^[[:space:]]*(Issue:[[:space:]]+)?N/A([[:space:]]+[—\-].+)?[[:space:]]*$'; then
            echo "Issue reference opted out with N/A — skipping check"
            exit 0
          fi

          # Require a GitHub closing keyword (case-insensitive).
          # "Closes N/A" or "Closes #N/A" will NOT match the N/A check above (not a standalone line)
          # and will NOT match this check — so they correctly fail CI.
          if ! echo "$PR_BODY_VISIBLE" | grep -iqE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::error::PR body must reference an issue with a closing keyword"
            echo ""
            echo "Add one of these to your PR description:"
            echo "  Closes #123"
            echo "  Fixes #123"
            echo "  Resolves #123"
            echo ""
            echo "For ad-hoc changes without an issue, add a standalone 'N/A' or 'Issue: N/A' line."
            echo ""
            echo "See: https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue"
            exit 1
          fi

  validate-plugin-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pins the Node that validate.py's check_dispatch_ledger_in_sync() shells out to.
      # GitHub Actions sets CI=true by default, so that check hard-fails (rather than
      # warning) if this step is ever removed or the runner image's Node drops below 22.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Validate plugin files
        run: bash scripts/validate.sh
      - name: Audit for undeclared version literals
        run: bash scripts/bump-version.sh --audit

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run shellcheck (warning+ on *.sh + auto-discovered executable extensionless bash/sh/ksh files)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
          check_together: 'yes'

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # Pins the Node the 5 behavioural tests in tests/test_pi_extension.py run against —
      # GitHub Actions sets CI=true by default, so tests/test_pi_extension.py's
      # requires_node ratchet fails loudly (not skips) if this step is ever removed.
      # without this, they silently ran against whatever the runner image happened to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      # Installs node_modules so tests/test_pi_contract.py's pinned-catalog tests can verify
      # MODEL_POLICY's exact ids against the bundled @earendil-works/pi-ai provider data — CI=true
      # makes their requires_pi_ai_catalog gate fail loudly (not skip) if this step is removed.
      - run: npm ci
      - run: pip install --require-hashes -r tests/requirements.lock
      - run: pytest tests/ -v

  handoff-py39:
    name: "handoff:python3.9"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # 3.9 installs FIRST so the later 3.12 setup owns `python3`/`pip` for pytest, while the
      # 3.9 toolchain stays addressable as `python3.9` — what the guard regression test
      # discovers. CI=true makes that test fail loudly (not skip) if this job ever disappears.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.9'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r tests/requirements.lock
      - run: pytest tests/test_handoff_script.py -k "3_9" -v

  typecheck-pi:
    name: "typecheck:pi"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck

  lockfile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify lockfiles are up to date
        run: bash scripts/lock-pip-requirements.sh --check

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --config .lychee.toml './**/*.md'
          fail: true
